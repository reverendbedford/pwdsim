[project]
name = "pwdsim"
dynamic = ["version"]
description = "A pytorch Pinewood Derby simulator and optimizer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Messner", email = "mark.messner@gmail.com" }]
requires-python = ">=3.12"
keywords = ["pinewood derby", "simulation", "optimization", "pytorch", "physics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.4",
    "matplotlib>=3.8",
    "numpy>=2.5.3",
    "pyzag>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/reverendbedford/pwdsim"
Documentation = "https://reverendbedford.github.io/pwdsim/"
Source = "https://github.com/reverendbedford/pwdsim"
Issues = "https://github.com/reverendbedford/pwdsim/issues"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.5",
    "pre-commit>=3.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    { include-group = "docs" },
]
docs = [
    "ipykernel>=7.3.0",
    "mkdocs>=1.6",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["slow: slow tests, skipped unless pytest is run with --runslow"]

[tool.coverage.run]
source = ["pwdsim"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.jupytext]
formats = "ipynb,py:percent"
