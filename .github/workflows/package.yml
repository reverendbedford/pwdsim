name: Package

# Builds the sdist and wheel, checks them, and runs the tests against the installed
# wheel rather than the source tree.  Called by the CI and release workflows; the
# packages are uploaded as the "dist" artifact.
on:
  workflow_call:

jobs:
  package:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      # The version comes from the git tags (hatch-vcs), so fetch the full history
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Check that the sdist builds a wheel
        run: uv build --wheel --out-dir /tmp/from-sdist dist/*.tar.gz
      - name: Test the installed wheel
        run: |
          uv venv /tmp/pkg --python 3.12
          uv pip install --python /tmp/pkg dist/*.whl pytest
          /tmp/pkg/bin/python -c \
            "import pwdsim; assert 'site-packages' in pwdsim.__file__; print(pwdsim.__version__)"
          /tmp/pkg/bin/pytest -p no:cacheprovider tests
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
